# --- Observability ---
health-enabled=true
# ---metrics-enabled=true
# ---metrics-security-realm=metrics-realm

# --- HTTP/HTTPS Configuration ---
http-port=8080
# ---https-port=8443
# ---https-certificate-file=${kc.home.dir}/conf/server.crt.pem
# ---https-certificate-key-file=${kc.home.dir}/conf/server.key.pem
# ---http-enabled=true
# ---https-relative-redirects=false
# ---https-strict-transport-security=true
# ---https-strict-transport-security-max-age=31536000

# --- Proxy Configuration ---
# ---proxy=edge

# --- Hostname Configuration ---
# hostname=integration02.elisecloud.tn
# hostname-strict=true
# hostname-strict-backchannel=true  
# hostname-port=8443
# hostname-admin-url=https://integration02.elisecloud.tn
# hostname-url=https://integration02.elisecloud.tn

# --- Clustering Configuration ---
# ---cache=ispn
# ---cluster-stack=tcp
# ---cluster=HA
# ---spi-connections-http-client-default-connection-pool-size=50
# ---spi-connections-http-client-default-max-connections=200

# --- JGroups TCP Configuration ---
# ---jgroups.tcp.bind_addr=0.0.0.0
# ---jgroups.tcp.port=7600
# ---jgroups.tcp.ip_ttl=8
# ---jgroups.tcp.max_bundle_size=128K  
# ---jgroups.tcp.max_bundle_timeout=20  

# --- Database Configuration ---
# db=postgres
# db-username=keycloak
# db-password=secure_password
# db-url=jdbc:postgresql://db-host:5432/keycloak
# db-pool-min-size=10
# db-pool-max-size=50
# db-pool-acquisition-timeout=30

# --- Logging Configuration ---
log-level=INFO
log-format=plain
log-console-output=default
log-console-format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{1.}] (%t) %s%e%n
log-file-enabled=true
log-file=${kc.home.dir}/log/keycloak.log

# --- Startup and Runtime Options ---
spi-session-cleaner-period=600
spi-session-max-lifetime=7200
spi-session-activity-timeout=3600
access-token-lifespan=600
refresh-token-lifespan=7200
lazy-start=true

# --- Transaction Configuration ---
quarkus.transaction-manager.enable-recovery=true
transaction-timeout=300

# --- Security Configuration ---
strict-transport-security=true
x-frame-options=SAMEORIGIN
content-security-policy="default-src 'self'; script-src 'self'; object-src 'none'; style-src 'self' 'unsafe-inline'"
referrer-policy=strict-origin-when-cross-origin

# --- CORS Configuration ---
# cors-allowed-origins=https://integration02.elisecloud.tn
# cors-allowed-methods=GET,OPTIONS
# cors-allowed-headers=Content-Type,Authorization
# cors-max-age=86400

# --- Performance Tuning ---
quarkus.thread-pool.core-threads=16
quarkus.thread-pool.max-threads=128
quarkus.thread-pool.queue-size=256

# --- TLS Configuration ---
# --- TLS Configuration ---
# ---https-tls-min-version=TLSv1.3
# ---https-tls-ciphers=TLS_AES_256_GCM_SHA384,TLS_CHACHA20_POLY1305_SHA256,TLS_AES_128_GCM_SHA256

# --- JGroups Diagnostics ---
jgroups.diagnostics=false
